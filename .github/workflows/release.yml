name: Release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed v-prefixed tag
        type: string
        required: true
      target:
        description: Native platforms; windows-intel reuses local ARM, all also drafts
        type: choice
        options: [windows, mac-arm, mac-intel, windows-intel, all]
        default: windows
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      builds: ${{ steps.version.outputs.builds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: node scripts/release-config.mjs --validate-tag
      - run: npm ci
      - run: npm run test:edge && npm run test:probe && npm run test:tooling && npm test && npm run build
      - name: Load private release gate
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: node scripts/install-private-gate.mjs
      - run: node scripts/privacy-check.mjs --working-tree --history
  build:
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.builds) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: npm ci
      - run: node scripts/build-paths.mjs
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Load private release gate
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: node scripts/install-private-gate.mjs
      - name: Configure signed updates
        env:
          SLG_UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          SLG_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: node scripts/release-config.mjs
      - name: Prepare pinned macOS signing tool
        if: runner.os == 'macOS'
        run: node scripts/rcodesign-tool.mjs --install
      # Stage only the approved, hash-pinned, checked-in archive for this target.
      # The current UNAPPROVED manifest stops this draft before extraction.
      - name: Stage approved frozen macOS credential helper
        if: runner.os == 'macOS'
        run: node scripts/stage-macos-credential-helper.mjs ${{ matrix.target }}
      - name: Build installers locally on native runner
        id: package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SLG_MACOS_SIGNING_P12_BASE64: ${{ runner.os == 'macOS' && secrets.MACOS_SIGNING_P12_BASE64 || '' }}
          SLG_MACOS_SIGNING_P12_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_SIGNING_P12_PASSWORD || '' }}
          SLG_MACOS_CERT_SHA256: ${{ vars.MACOS_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ulimit -S -c 0
            ulimit -H -c 0
            node scripts/stable-macos-sign.mjs -- npm run tauri -- build --target ${{ matrix.target }} --config release-config.json --bundles ${{ matrix.bundles }}
          else
            npm run tauri -- build --target ${{ matrix.target }} --config release-config.json --bundles ${{ matrix.bundles }}
          fi
      - name: Download the pinned public Windows upgrade baseline
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $baselineDirectory = Join-Path $env:RUNNER_TEMP 'shortlink-upgrade-baseline'
          New-Item -ItemType Directory -Path $baselineDirectory -ErrorAction Stop | Out-Null
          gh release download v0.1.5 --repo "$env:GITHUB_REPOSITORY" --dir "$baselineDirectory" --pattern 'short-link-generator_0.1.5_windows-x86_64.exe' --pattern 'short-link-generator_0.1.5_windows-x86_64.exe.sig'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows baseline download failed.' }
      - name: Verify Windows installation upgrade and preserve configuration
        id: windows_upgrade
        if: runner.os == 'Windows'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          SLG_UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
        shell: pwsh
        run: |
          $baselineInstaller = Join-Path $env:RUNNER_TEMP 'shortlink-upgrade-baseline/short-link-generator_0.1.5_windows-x86_64.exe'
          node scripts/windows-upgrade-smoke.mjs "$baselineInstaller" src-tauri/target/${{ matrix.target }}/release/bundle
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows upgrade verification failed.' }
      - name: Install and launch the candidate on its native runner
        id: native_smoke
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          SLG_UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          SLG_MACOS_CERT_SHA256: ${{ vars.MACOS_SIGNING_CERT_SHA256 }}
          SLG_MACOS_HELPER_TREE_SHA256_ARM64: ${{ vars.MACOS_HELPER_TREE_SHA256_ARM64 }}
          SLG_MACOS_HELPER_TREE_SHA256_X64: ${{ vars.MACOS_HELPER_TREE_SHA256_X64 }}
        run: node scripts/native-smoke.mjs src-tauri/target/${{ matrix.target }}/release/bundle ${{ matrix.target }}
      - name: Inspect candidate contents before upload
        id: privacy
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          SLG_RELEASE_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SLG_MACOS_SIGNING_P12_BASE64: ${{ runner.os == 'macOS' && secrets.MACOS_SIGNING_P12_BASE64 || '' }}
          SLG_MACOS_SIGNING_P12_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_SIGNING_P12_PASSWORD || '' }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ulimit -S -c 0
            ulimit -H -c 0
          fi
          node scripts/artifact-check.mjs src-tauri/target/${{ matrix.target }}/release/bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.native_smoke.outcome == 'success' && steps.privacy.outcome == 'success' && (runner.os != 'Windows' || steps.windows_upgrade.outcome == 'success') }}
        with:
          name: candidate-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle
          if-no-files-found: error
          retention-days: 1
  draft:
    if: inputs.target == 'all'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: candidate-*
          path: candidates
      - name: Verify all three native candidates and assemble the draft assets
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          SLG_UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          SLG_MACOS_CERT_SHA256: ${{ vars.MACOS_SIGNING_CERT_SHA256 }}
          SLG_MACOS_HELPER_TREE_SHA256_ARM64: ${{ vars.MACOS_HELPER_TREE_SHA256_ARM64 }}
          SLG_MACOS_HELPER_TREE_SHA256_X64: ${{ vars.MACOS_HELPER_TREE_SHA256_X64 }}
        run: node scripts/release-manifest.mjs candidates --require-evidence
      - name: Create a draft for final review
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-draft.mjs
